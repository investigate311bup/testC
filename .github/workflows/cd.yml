name: CD Frontend (Render)

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  deploy-frontend:
    if: >
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'dev' }}
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Static Site deploy
        run: curl -X POST "$RENDER_API_KEY"
        env:
          RENDER_STATIC_DEPLOY_HOOK: ${{ secrets.RENDER_API_KEY }}
